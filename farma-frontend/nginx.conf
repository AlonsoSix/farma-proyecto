server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    # Al levantar el contenedor, la raíz abre directamente el login.
    index login.html;

    # El navegador llama a /api/... y Nginx lo reenvía al backend.
    # Así no hay CORS ni puertos distintos: todo parece el mismo sitio.
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /login.html;
    }

    # Archivos estáticos con caché corta (útil durante pruebas).
    location ~* \.(css|js|png|jpg|jpeg|gif|webp|svg|ico|pdf)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}

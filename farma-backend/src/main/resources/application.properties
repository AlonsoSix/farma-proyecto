# =====================================================================
#  FARMA - Configuración única del backend
#
#  Este es el ÚNICO archivo de configuración de main. No existe
#  application.properties.example: los valores se sobrescriben siempre
#  con variables de entorno (Docker, Render, IDE) o con un .env local
#  que NO se sube al repositorio.
#
#  Para desarrollo local: copia .env.example a .env en la raíz y ajusta
#  DB_PASSWORD. Para Docker: el compose inyecta las mismas variables.
# =====================================================================

spring.application.name=farma-backend

# El .env local (ignorado por Git) se carga como si fuera un .properties.
# Se buscan las dos ubicaciones porque mvn/spring-boot:run se ejecuta desde
# farma-backend/ mientras que la IDE usa la raíz del repositorio.
# En Docker no existen y se omiten sin error: ahí llegan las variables reales.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# ---------------------------------------------------------------------
# Base de datos
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/farma_db?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:farma}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8081}

# ---------------------------------------------------------------------
# Culqi (sandbox)
# Con las llaves vacías la tienda queda en modo de pago simulado.
# NUNCA escribas llaves reales aquí: usa CULQI_PUBLIC_KEY / CULQI_SECRET_KEY.
# ---------------------------------------------------------------------
culqi.public-key=${CULQI_PUBLIC_KEY:}
culqi.secret-key=${CULQI_SECRET_KEY:}
culqi.api-url=${CULQI_API_URL:https://api.culqi.com/v2}
culqi.modo=${CULQI_MODO:}

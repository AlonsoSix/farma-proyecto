# =====================================================================
# Configuración del entorno de pruebas unitarias y de integración
# Base de datos en memoria H2 aislada para pruebas repetibles y rápidas
# =====================================================================
spring.datasource.url=jdbc:h2:mem:farma_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Culqi en modo simulado para pruebas
culqi.public-key=
culqi.private-key=
culqi.modo=prueba
